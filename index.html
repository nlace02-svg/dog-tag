
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Canine Smart Passport & Medical Tag</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const tagId = urlParams.get('tag') || "TAG-001";
      const storageKey = `dog_passport_v3_${tagId}`;

      const defaultDog = {
        name: '',
        breed: '',
        color: '',
        gender: 'Male (Neutered)',
        dob: '',
        weight: '',
        microchip: '',
        microchipRegistry: 'AKC Reunite / HomeAgain',
        rabiesTag: '',
        rabiesExpiry: '',
        coreVaccines: 'Up to Date (DHPP, Bordetella)',
        dietAllergies: '',
        medicalNotes: '',
        temperament: 'Friendly & Gentle',
        behaviorAlerts: '',
        ownerName: '',
        ownerPhone: '',
        backupContactName: '',
        backupContactPhone: '',
        vetClinic: '',
        vetPhone: '',
        reward: '$250',
        lastSeen: 'Nearby Neighborhood / Park',
        photo: 'https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80'
      };

      // Direct initial load from localStorage
      const [isRegistered, setIsRegistered] = useState(() => {
        try {
          const item = localStorage.getItem(storageKey);
          return item ? JSON.parse(item).isRegistered : false;
        } catch (e) {
          return false;
        }
      });

      const [isMissing, setIsMissing] = useState(() => {
        try {
          const item = localStorage.getItem(storageKey);
          return item ? JSON.parse(item).isMissing : false;
        } catch (e) {
          return false;
        }
      });

      const [dog, setDog] = useState(() => {
        try {
          const item = localStorage.getItem(storageKey);
          return item ? { ...defaultDog, ...JSON.parse(item).dog } : defaultDog;
        } catch (e) {
          return defaultDog;
        }
      });

      const [activeTab, setActiveTab] = useState('summary');
      const [isCompressing, setIsCompressing] = useState(false);
      const canvasRef = useRef(null);

      // Explicit Synchronous Save Function
      const persistToLocalStorage = (newDog, newRegistered, newMissing) => {
        try {
          const data = {
            dog: newDog,
            isRegistered: newRegistered,
            isMissing: newMissing
          };
          localStorage.setItem(storageKey, JSON.stringify(data));
        } catch (error) {
          console.error("Storage error:", error);
          alert("Could not save to browser storage. Make sure your photo is not too large.");
        }
      };

      // Handle Image Compression for Mobile Gallery Pickers
      const handlePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const base64Data = canvas.toDataURL('image/jpeg', 0.7);
            const updated = { ...dog, photo: base64Data };
            setDog(updated);
            persistToLocalStorage(updated, isRegistered, isMissing);
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      // Form Submission
      const handleFormSubmit = (e) => {
        e.preventDefault();
        setIsRegistered(true);
        persistToLocalStorage(dog, true, isMissing);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Toggle Missing
      const toggleMissing = () => {
        const nextMissing = !isMissing;
        setIsMissing(nextMissing);
        persistToLocalStorage(dog, isRegistered, nextMissing);
      };

      // Reset Tag Data
      const handleReset = () => {
        if (confirm(`Reset this entire profile for Chip ID: ${tagId}?`)) {
          localStorage.removeItem(storageKey);
          setDog(defaultDog);
          setIsRegistered(false);
          setIsMissing(false);
        }
      };

      // Generate Poster
      const generatePoster = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 1600;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 1200, 1600);

        ctx.fillStyle = '#DC2626';
        ctx.fillRect(0, 0, 1200, 240);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 86px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LOST DOG', 600, 120);

        ctx.font = 'bold 36px sans-serif';
        ctx.fillText(`REWARD: ${dog.reward || '$250'} • PLEASE HELP`, 600, 190);

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = dog.photo;
        img.onload = () => {
          ctx.drawImage(img, 120, 280, 960, 580);

          ctx.fillStyle = '#0F172A';
          ctx.font = '900 68px sans-serif';
          ctx.fillText((dog.name || 'DOG').toUpperCase(), 600, 930);

          ctx.font = 'bold 32px sans-serif';
          ctx.fillStyle = '#475569';
          ctx.fillText(`${dog.breed || 'Dog'} • ${dog.color || 'Markings'} • ${dog.gender}`, 600, 980);

          ctx.fillStyle = '#FEF2F2';
          ctx.fillRect(120, 1010, 960, 80);
          ctx.strokeStyle = '#FCA5A5';
          ctx.strokeRect(120, 1010, 960, 80);

          ctx.fillStyle = '#991B1B';
          ctx.font = 'bold 28px sans-serif';
          ctx.fillText(`LAST SEEN: ${dog.lastSeen}`, 600, 1060);

          ctx.fillStyle = '#334155';
          ctx.font = '24px sans-serif';
          ctx.fillText(`Microchip: ${dog.microchip || 'On File'} | Rabies Tag: ${dog.rabiesTag || 'Active'}`, 600, 1140);
          
          if (dog.medicalNotes) {
            ctx.fillStyle = '#B91C1C';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText(`MEDICAL: ${dog.medicalNotes}`, 600, 1180);
          }

          ctx.fillStyle = '#0F172A';
          ctx.fillRect(80, 1230, 1040, 310);

          ctx.fillStyle = '#FBBF24';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('IF FOUND OR SEEN, CALL IMMEDIATELY:', 600, 1300);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 64px sans-serif';
          ctx.fillText(dog.ownerPhone || '(555) 000-0000', 600, 1380);

          if (dog.backupContactPhone) {
            ctx.font = 'bold 30px sans-serif';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(`Backup Contact (${dog.backupContactName || 'Alt'}): ${dog.backupContactPhone}`, 600, 1440);
          }

          ctx.font = '24px sans-serif';
          ctx.fillStyle = '#E2E8F0';
          ctx.fillText(`Guardian: ${dog.ownerName}`, 600, 1495);

          const link = document.createElement('a');
          link.download = `${dog.name || 'LOST-DOG'}-POSTER.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };
      };

      // -------------------------------------------------------------
      // 1. SETUP / REGISTRATION VIEW
      // -------------------------------------------------------------
      if (!isRegistered) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 py-8">
            <div className="max-w-xl w-full bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-mono bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded-full uppercase tracking-wider font-semibold">
                    New Tag Setup
                  </span>
                  <span className="text-xs font-mono text-slate-500">ID: {tagId}</span>
                </div>
                <h1 className="text-2xl font-bold text-white mt-2">Dog Passport Registration</h1>
                <p className="text-xs text-slate-400">
                  Save all medical, identity, and emergency vet information to this chip.
                </p>
              </div>

              <form onSubmit={handleFormSubmit} className="space-y-6">
                
                {/* Photo Picker */}
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                  <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                    Pet Photo
                  </label>
                  
                  <input 
                    type="file" 
                    id="mobile-photo"
                    accept="image/*" 
                    onChange={handlePhotoUpload} 
                    className="hidden"
                  />

                  <label 
                    htmlFor="mobile-photo"
                    className="inline-flex items-center justify-center gap-2 px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs cursor-pointer shadow-md transition active:scale-95"
                  >
                    📷 {isCompressing ? 'Compressing Photo...' : 'Upload from Phone Gallery'}
                  </label>

                  {dog.photo && (
                    <div className="mt-3 flex items-center justify-center gap-3">
                      <img src={dog.photo} alt="Preview" className="w-14 h-14 rounded-full object-cover border-2 border-amber-400" />
                      <span className="text-[11px] text-emerald-400 font-semibold">Photo Loaded</span>
                    </div>
                  )}
                </div>

                {/* 1. Identity */}
                <div className="space-y-3">
                  <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">1. Dog Identity</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">DOG NAME *</label>
                      <input type="text" value={dog.name} onChange={(e) => setDog({ ...dog, name: e.target.value })} placeholder="e.g. Barnaby" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">BREED *</label>
                      <input type="text" value={dog.breed} onChange={(e) => setDog({ ...dog, breed: e.target.value })} placeholder="e.g. Golden Retriever" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">COLOR / MARKINGS</label>
                      <input type="text" value={dog.color} onChange={(e) => setDog({ ...dog, color: e.target.value })} placeholder="e.g. Golden / White Patch" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">GENDER & STATUS</label>
                      <select value={dog.gender} onChange={(e) => setDog({ ...dog, gender: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none">
                        <option>Male (Neutered)</option>
                        <option>Male (Intact)</option>
                        <option>Female (Spayed)</option>
                        <option>Female (Intact)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">DOB / AGE</label>
                      <input type="text" value={dog.dob} onChange={(e) => setDog({ ...dog, dob: e.target.value })} placeholder="e.g. 3 Years (April 2023)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">WEIGHT</label>
                      <input type="text" value={dog.weight} onChange={(e) => setDog({ ...dog, weight: e.target.value })} placeholder="e.g. 65 lbs" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                  </div>
                </div>

                {/* 2. Microchip & Rabies */}
                <div className="space-y-3 pt-2">
                  <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">2. Microchip & Rabies Compliance</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">15-DIGIT MICROCHIP ID</label>
                      <input type="text" value={dog.microchip} onChange={(e) => setDog({ ...dog, microchip: e.target.value })} placeholder="985141000842109" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-amber-300 focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">MICROCHIP REGISTRY</label>
                      <input type="text" value={dog.microchipRegistry} onChange={(e) => setDog({ ...dog, microchipRegistry: e.target.value })} placeholder="AKC Reunite / HomeAgain" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">RABIES TAG NUMBER</label>
                      <input type="text" value={dog.rabiesTag} onChange={(e) => setDog({ ...dog, rabiesTag: e.target.value })} placeholder="RB-2025-9812" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">RABIES EXPIRATION DATE</label>
                      <input type="text" value={dog.rabiesExpiry} onChange={(e) => setDog({ ...dog, rabiesExpiry: e.target.value })} placeholder="e.g. May 2028" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                  </div>
                </div>

                {/* 3. Veterinary Information */}
                <div className="space-y-3 pt-2">
                  <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">3. Primary Veterinary Clinic</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">PRIMARY VET CLINIC NAME</label>
                      <input type="text" value={dog.vetClinic} onChange={(e) => setDog({ ...dog, vetClinic: e.target.value })} placeholder="City Animal Hospital" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">VET CLINIC PHONE</label>
                      <input type="tel" value={dog.vetPhone} onChange={(e) => setDog({ ...dog, vetPhone: e.target.value })} placeholder="+1 (555) 991-0022" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                  </div>
                </div>

                {/* 4. Guardian Contacts */}
                <div className="space-y-3 pt-2">
                  <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">4. Guardians & Emergency Contacts</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">OWNER / GUARDIAN NAME *</label>
                      <input type="text" value={dog.ownerName} onChange={(e) => setDog({ ...dog, ownerName: e.target.value })} placeholder="Alex Smith" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">OWNER PHONE (FOR EMERGENCY SCANNERS) *</label>
                      <input type="tel" value={dog.ownerPhone} onChange={(e) => setDog({ ...dog, ownerPhone: e.target.value })} placeholder="+1 (555) 019-2834" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-emerald-400 focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">BACKUP CONTACT NAME</label>
                      <input type="text" value={dog.backupContactName} onChange={(e) => setDog({ ...dog, backupContactName: e.target.value })} placeholder="Jordan (Co-owner / Friend)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">BACKUP PHONE</label>
                      <input type="tel" value={dog.backupContactPhone} onChange={(e) => setDog({ ...dog, backupContactPhone: e.target.value })} placeholder="+1 (555) 019-8822" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                  </div>
                </div>

                {/* 5. Medical & Behavior */}
                <div className="space-y-3 pt-2">
                  <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">5. Medical Notes & Temperament</h3>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">DIETARY ALLERGIES</label>
                      <input type="text" value={dog.dietAllergies} onChange={(e) => setDog({ ...dog, dietAllergies: e.target.value })} placeholder="e.g. Severe Chicken Allergy" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">MEDICATIONS & CHRONIC CONDITIONS</label>
                      <textarea value={dog.medicalNotes} onChange={(e) => setDog({ ...dog, medicalNotes: e.target.value })} placeholder="e.g. Daily Apoquel required. Mild arthritis." rows="2" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">TEMPERAMENT</label>
                        <input type="text" value={dog.temperament} onChange={(e) => setDog({ ...dog, temperament: e.target.value })} placeholder="e.g. Sweet, skittish around strangers" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">BEHAVIORAL / FLIGHT TRIGGERS</label>
                        <input type="text" value={dog.behaviorAlerts} onChange={(e) => setDog({ ...dog, behaviorAlerts: e.target.value })} placeholder="e.g. Scared of thunderstorms, do not grab collar" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-amber-400 focus:outline-none" />
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-xl mt-4 active:scale-95"
                >
                  Save Profile & Activate Tag #{tagId}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // 2. ACTIVE PASSPORT PROFILE VIEW
      // -------------------------------------------------------------
      return (
        <div className="min-h-screen flex flex-col items-center py-6 px-4">
          <canvas ref={canvasRef} className="hidden" />

          <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
            
            {/* Missing Status Alert Banner */}
            {isMissing && (
              <div className="bg-red-600 px-4 py-3 text-center text-white font-extrabold tracking-wider text-xs md:text-sm animate-pulse flex items-center justify-center gap-2">
                <span>🚨 URGENT: THIS DOG IS CURRENTLY REPORTED MISSING 🚨</span>
              </div>
            )}

            {/* Profile Photo Card */}
            <div className="relative h-72 w-full bg-slate-950">
              <img src={dog.photo} alt={dog.name} className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/30 to-transparent" />
              
              <div className="absolute top-4 left-4">
                <span className="text-[10px] font-mono bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full text-amber-400 border border-amber-500/30">
                  NFC TAG #{tagId}
                </span>
              </div>

              <div className="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                <div>
                  <h1 className="text-3xl font-black text-white">{dog.name}</h1>
                  <p className="text-xs text-amber-300 font-semibold">{dog.breed} • {dog.gender}</p>
                </div>
                <span className="text-xs font-mono bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 px-2 py-1 rounded-lg">
                  Passport Active
                </span>
              </div>
            </div>

            {/* Direct Dial Hotkeys */}
            <div className="p-4 grid grid-cols-2 gap-2 bg-slate-900/90 border-b border-slate-800">
              <a
                href={`tel:${dog.ownerPhone}`}
                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-2 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition text-center"
              >
                📞 Call Guardian
              </a>
              {dog.vetPhone ? (
                <a
                  href={`tel:${dog.vetPhone}`}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-2 rounded-xl flex items-center justify-center gap-1.5 text-xs border border-slate-700 transition text-center"
                >
                  🏥 Call Vet Clinic
                </a>
              ) : (
                <a
                  href={`tel:${dog.backupContactPhone || dog.ownerPhone}`}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-2 rounded-xl flex items-center justify-center gap-1.5 text-xs border border-slate-700 transition text-center"
                >
                  📱 Backup Contact
                </a>
              )}
            </div>

            {/* Tabs */}
            <div className="flex border-b border-slate-800 text-xs font-semibold bg-slate-950/40">
              <button 
                onClick={() => setActiveTab('summary')}
                className={`flex-1 py-3 transition border-b-2 ${activeTab === 'summary' ? 'border-amber-400 text-amber-400 bg-slate-800/40' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
              >
                Vitals & ID
              </button>
              <button 
                onClick={() => setActiveTab('medical')}
                className={`flex-1 py-3 transition border-b-2 ${activeTab === 'medical' ? 'border-amber-400 text-amber-400 bg-slate-800/40' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
              >
                Medical & Rabies
              </button>
              <button 
                onClick={() => setActiveTab('vet')}
                className={`flex-1 py-3 transition border-b-2 ${activeTab === 'vet' ? 'border-amber-400 text-amber-400 bg-slate-800/40' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
              >
                Vet & Behavior
              </button>
            </div>

            {/* TAB 1: VITALS */}
            {activeTab === 'summary' && (
              <div className="p-5 space-y-4">
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-500 font-bold uppercase">Color</span>
                    <p className="font-semibold text-slate-200 mt-0.5">{dog.color || 'Standard'}</p>
                  </div>
                  <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-500 font-bold uppercase">Weight & Age</span>
                    <p className="font-semibold text-slate-200 mt-0.5">{dog.weight || 'N/A'} • {dog.dob || 'Adult'}</p>
                  </div>
                </div>

                <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Microchip Number</span>
                  <p className="font-mono text-sm tracking-wider text-slate-100 font-bold select-all">{dog.microchip || 'No Microchip Logged'}</p>
                  <p className="text-[11px] text-slate-400">Registry: {dog.microchipRegistry}</p>
                </div>

                <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Primary Guardian</span>
                  <p className="text-xs font-semibold text-slate-200">{dog.ownerName}</p>
                  <p className="text-xs font-mono text-emerald-400">{dog.ownerPhone}</p>
                </div>
              </div>
            )}

            {/* TAB 2: MEDICAL */}
            {activeTab === 'medical' && (
              <div className="p-5 space-y-3">
                <div className="bg-emerald-950/20 border border-emerald-500/30 p-3.5 rounded-xl space-y-1">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Rabies Certification</span>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">Active</span>
                  </div>
                  <p className="text-xs text-slate-200"><strong>Tag #:</strong> {dog.rabiesTag || 'RB-ON-FILE'}</p>
                  <p className="text-xs text-slate-200"><strong>Expires:</strong> {dog.rabiesExpiry || 'Verified'}</p>
                </div>

                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Dietary Allergies</span>
                  <p className="text-xs text-slate-200 leading-relaxed">{dog.dietAllergies || 'No known allergies.'}</p>
                </div>

                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-rose-400 font-bold uppercase tracking-wider">Medical Notes & Meds</span>
                  <p className="text-xs text-slate-200 leading-relaxed">{dog.medicalNotes || 'No chronic issues.'}</p>
                </div>
              </div>
            )}

            {/* TAB 3: VET & BEHAVIOR */}
            {activeTab === 'vet' && (
              <div className="p-5 space-y-3">
                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Veterinary Clinic</span>
                  <p className="text-xs font-semibold text-slate-200">{dog.vetClinic || 'Not Specified'}</p>
                  {dog.vetPhone && <p className="text-xs font-mono text-slate-300">Phone: {dog.vetPhone}</p>}
                </div>

                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Temperament</span>
                  <p className="text-xs text-slate-200 leading-relaxed">{dog.temperament}</p>
                </div>

                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] text-rose-400 font-bold uppercase tracking-wider">Behavior & Triggers</span>
                  <p className="text-xs text-slate-200 leading-relaxed">{dog.behaviorAlerts || 'No aggressive triggers known.'}</p>
                </div>
              </div>
            )}

            {/* Control Panel */}
            <div className="p-5 bg-slate-950 border-t border-slate-800 space-y-3">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold text-slate-200">Lost Dog Alert</span>
                  <p className="text-[10px] text-slate-500">Flags profile on live scans</p>
                </div>
                <button
                  onClick={toggleMissing}
                  className={`text-xs px-3.5 py-2 rounded-xl font-bold transition shadow ${
                    isMissing ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {isMissing ? '⚠️ Missing Active' : 'Mark as Missing'}
                </button>
              </div>

              <button
                onClick={generatePoster}
                className="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-xs transition border border-slate-700"
              >
                📥 Download Lost Poster (PNG)
              </button>

              <div className="flex justify-between items-center pt-2 text-[11px] text-slate-500 border-t border-slate-800/80">
                <button onClick={() => setIsRegistered(false)} className="hover:text-amber-400 transition">
                  ✏️ Edit Profile
                </button>
                <button onClick={handleReset} className="hover:text-rose-400 transition">
                  Reset Chip Memory
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
