<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Canine Smart Tag & Cloud Passport</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase Client JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- YOUR SUPABASE KEYS CONNECTED ---
    const SUPABASE_URL = "https://dfwpysspoktjmngafqkp.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_B6kUCkNu8HRPn9LecrBkGQ_gI9pCZnO";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const tagId = urlParams.get('tag') || "TAG-DEMO-001";

      const defaultDog = {
        name: '',
        breed: '',
        color: '',
        gender: 'Male (Neutered)',
        dob: '',
        weight: '',
        microchip: '',
        microchip_registry: 'AKC Reunite / HomeAgain',
        rabies_tag: '',
        rabies_expiry: '',
        diet_allergies: '',
        medical_notes: '',
        temperament: 'Friendly & Gentle',
        behavior_alerts: '',
        owner_name: '',
        owner_phone: '',
        backup_name: '',
        backup_phone: '',
        vet_clinic: '',
        vet_phone: '',
        reward: '$250',
        last_seen: 'Local Area',
        photo: 'https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80'
      };

      const [isLoading, setIsLoading] = useState(true);
      const [isRegistered, setIsRegistered] = useState(false);
      const [isMissing, setIsMissing] = useState(false);
      const [dog, setDog] = useState(defaultDog);
      const [activeTab, setActiveTab] = useState('summary');
      const [isSaving, setIsSaving] = useState(false);
      const canvasRef = useRef(null);

      // 1. Fetch Dog from Supabase Cloud on Scan
      useEffect(() => {
        async function fetchTagRecord() {
          setIsLoading(true);
          try {
            const { data, error } = await supabaseClient
              .from('dog_passports')
              .select('*')
              .eq('tag_id', tagId)
              .maybeSingle();

            if (error) {
              console.error("Cloud lookup error:", error);
            } else if (data) {
              setDog(data);
              setIsRegistered(data.is_registered);
              setIsMissing(data.is_missing);
            }
          } catch (err) {
            console.error(err);
          } finally {
            setIsLoading(false);
          }
        }
        fetchTagRecord();
      }, [tagId]);

      // 2. Mobile Photo Compressor
      const handlePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.7);
            setDog(prev => ({ ...prev, photo: compressed }));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      // 3. Save / Update to Cloud Database
      const saveToDatabase = async (newDog, registeredStatus, missingStatus) => {
        setIsSaving(true);
        const payload = {
          ...newDog,
          tag_id: tagId,
          is_registered: registeredStatus,
          is_missing: missingStatus,
          updated_at: new Date().toISOString()
        };

        const { error } = await supabaseClient
          .from('dog_passports')
          .upsert(payload, { onConflict: 'tag_id' });

        setIsSaving(false);
        if (error) {
          alert("Error saving profile to database: " + error.message);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setIsRegistered(true);
        await saveToDatabase(dog, true, isMissing);
      };

      const toggleMissing = async () => {
        const nextState = !isMissing;
        setIsMissing(nextState);
        await saveToDatabase(dog, isRegistered, nextState);
      };

      // 4. Missing Poster Canvas Generator
      const generatePoster = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 1600;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 1200, 1600);
        ctx.fillStyle = '#DC2626';
        ctx.fillRect(0, 0, 1200, 240);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 86px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LOST DOG', 600, 120);

        ctx.font = 'bold 36px sans-serif';
        ctx.fillText(`REWARD: ${dog.reward || '$250'}`, 600, 190);

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = dog.photo;
        img.onload = () => {
          ctx.drawImage(img, 120, 280, 960, 580);
          ctx.fillStyle = '#0F172A';
          ctx.font = '900 68px sans-serif';
          ctx.fillText((dog.name || 'PET').toUpperCase(), 600, 930);

          ctx.font = 'bold 32px sans-serif';
          ctx.fillStyle = '#475569';
          ctx.fillText(`${dog.breed} • ${dog.color || ''} • ${dog.gender}`, 600, 980);

          ctx.fillStyle = '#0F172A';
          ctx.fillRect(80, 1230, 1040, 310);
          ctx.fillStyle = '#FBBF24';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('PLEASE CALL IMMEDIATELY:', 600, 1300);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 64px sans-serif';
          ctx.fillText(dog.owner_phone || '', 600, 1380);

          ctx.font = '24px sans-serif';
          ctx.fillText(`Guardian: ${dog.owner_name}`, 600, 1495);

          const link = document.createElement('a');
          link.download = `${dog.name || 'LOST'}-POSTER.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4">
            <div className="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p className="text-xs font-mono text-slate-400">Loading Dog Passport Record...</p>
          </div>
        );
      }

      // -------------------------------------------------------------
      // VIEW A: FIRST-TIME REGISTRATION FORM
      // -------------------------------------------------------------
      if (!isRegistered) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 py-8">
            <div className="max-w-xl w-full bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
              <div>
                <span className="text-[10px] font-mono bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded-full uppercase">
                  Unclaimed Smart Tag
                </span>
                <h1 className="text-2xl font-bold text-white mt-2">Activate Dog Passport</h1>
                <p className="text-xs text-slate-400 font-mono">Tag Assigned: {tagId}</p>
              </div>

              <form onSubmit={handleRegisterSubmit} className="space-y-4">
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                  <input type="file" id="photo-upload" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                  <label htmlFor="photo-upload" className="inline-block px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs cursor-pointer">
                    📷 Choose Pet Photo
                  </label>
                  {dog.photo && (
                    <div className="mt-3 flex items-center justify-center gap-2">
                      <img src={dog.photo} className="w-12 h-12 rounded-full object-cover border border-amber-400" />
                      <span className="text-[11px] text-emerald-400">Photo Attached</span>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="Dog Name *" required value={dog.name} onChange={e => setDog({...dog, name: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                  <input type="text" placeholder="Breed *" required value={dog.breed} onChange={e => setDog({...dog, breed: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="Color & Markings" value={dog.color} onChange={e => setDog({...dog, color: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                  <input type="text" placeholder="Weight (e.g. 60 lbs)" value={dog.weight} onChange={e => setDog({...dog, weight: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="15-Digit Microchip ID" value={dog.microchip} onChange={e => setDog({...dog, microchip: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-amber-300" />
                  <input type="text" placeholder="Rabies Tag #" value={dog.rabies_tag} onChange={e => setDog({...dog, rabies_tag: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="Primary Vet Name" value={dog.vet_clinic} onChange={e => setDog({...dog, vet_clinic: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                  <input type="tel" placeholder="Vet Phone Number" value={dog.vet_phone} onChange={e => setDog({...dog, vet_phone: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="Owner Name *" required value={dog.owner_name} onChange={e => setDog({...dog, owner_name: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />
                  <input type="tel" placeholder="Owner Phone *" required value={dog.owner_phone} onChange={e => setDog({...dog, owner_phone: e.target.value})} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-emerald-400" />
                </div>

                <textarea placeholder="Medical Notes / Allergies" value={dog.medical_notes} onChange={e => setDog({...dog, medical_notes: e.target.value})} rows="2" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" />

                <button type="submit" disabled={isSaving} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition">
                  {isSaving ? "Saving to Cloud Database..." : "Save to Cloud & Activate Tag"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // VIEW B: LIVE CLOUD PROFILE VIEW
      // -------------------------------------------------------------
      return (
        <div className="min-h-screen flex flex-col items-center py-6 px-4">
          <canvas ref={canvasRef} className="hidden" />

          <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
            {isMissing && (
              <div className="bg-red-600 px-4 py-3 text-center text-white font-black text-xs animate-pulse">
                🚨 REPORTED MISSING 🚨
              </div>
            )}

            <div className="relative h-72 w-full bg-slate-950">
              <img src={dog.photo} alt={dog.name} className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/30 to-transparent" />
              <div className="absolute top-4 left-4">
                <span className="text-[10px] font-mono bg-slate-950/80 px-2.5 py-1 rounded-full text-amber-400 border border-amber-500/30">
                  TAG #{tagId}
                </span>
              </div>
              <div className="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                <div>
                  <h1 className="text-3xl font-black text-white">{dog.name}</h1>
                  <p className="text-xs text-amber-300 font-semibold">{dog.breed}</p>
                </div>
              </div>
            </div>

            <div className="p-4 grid grid-cols-2 gap-2 border-b border-slate-800">
              <a href={`tel:${dog.owner_phone}`} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                📞 Call Guardian
              </a>
              {dog.vet_phone ? (
                <a href={`tel:${dog.vet_phone}`} className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  🏥 Call Vet
                </a>
              ) : (
                <button onClick={() => setIsRegistered(false)} className="bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">
                  ✏️ Edit
                </button>
              )}
            </div>

            <div className="flex border-b border-slate-800 text-xs font-semibold bg-slate-950/40">
              <button onClick={() => setActiveTab('summary')} className={`flex-1 py-3 border-b-2 ${activeTab === 'summary' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}`}>Summary</button>
              <button onClick={() => setActiveTab('medical')} className={`flex-1 py-3 border-b-2 ${activeTab === 'medical' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}`}>Medical</button>
              <button onClick={() => setActiveTab('vet')} className={`flex-1 py-3 border-b-2 ${activeTab === 'vet' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}`}>Vet & Clinic</button>
            </div>

            <div className="p-5">
              {activeTab === 'summary' && (
                <div className="space-y-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-500 font-bold uppercase">Microchip Number</span>
                    <p className="font-mono text-amber-400 text-sm font-bold">{dog.microchip || 'None Logged'}</p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-500 font-bold uppercase">Color / Weight</span>
                    <p className="text-slate-200">{dog.color || 'Standard'} • {dog.weight || 'N/A'}</p>
                  </div>
                </div>
              )}

              {activeTab === 'medical' && (
                <div className="space-y-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-emerald-400 font-bold uppercase">Rabies Tag Info</span>
                    <p className="text-slate-200">{dog.rabies_tag || 'On File'}</p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-rose-400 font-bold uppercase">Medical / Allergy Notes</span>
                    <p className="text-slate-300">{dog.medical_notes || 'None logged.'}</p>
                  </div>
                </div>
              )}

              {activeTab === 'vet' && (
                <div className="space-y-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 font-bold uppercase">Clinic Name</span>
                    <p className="text-slate-200 font-bold">{dog.vet_clinic || 'Not Specified'}</p>
                    {dog.vet_phone && <p className="text-slate-400 font-mono mt-1">Tel: {dog.vet_phone}</p>}
                  </div>
                </div>
              )}
            </div>

            <div className="p-5 bg-slate-950 border-t border-slate-800 space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold text-slate-300">Missing Dog Alert</span>
                <button onClick={toggleMissing} className={`text-xs px-3 py-1.5 rounded-xl font-bold ${isMissing ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                  {isMissing ? 'Missing Active' : 'Mark as Missing'}
                </button>
              </div>

              <button onClick={generatePoster} className="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-3 rounded-xl text-xs transition border border-slate-700">
                📥 Download Lost Poster (PNG)
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
